server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fraud-detection-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  task:
    scheduling:
      pool:
        size: 2

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTEyMzQ1Njc4OTA=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  ml-service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
    internal-key: ${ML_SERVICE_INTERNAL_KEY:fraud-detection-internal-key-2026}
    timeout-seconds: ${ML_SERVICE_TIMEOUT:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  drift:
    cron: ${DRIFT_CRON:0 0 */4 * * *}
    psi-threshold: ${DRIFT_PSI_THRESHOLD:0.20}
    window-days: ${DRIFT_WINDOW_DAYS:7}

logging:
  level:
    root: INFO
    com.frauddetect: INFO
    org.springframework.security: WARN
