version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fraud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fraud_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: fraud-ml-service
    restart: unless-stopped
    environment:
      PORT: 8000
      INTERNAL_API_KEY: ${ML_SERVICE_INTERNAL_KEY:-fraud-detection-internal-key-2026}
      MODEL_DIR: ./models
      ACTIVE_MODEL_VERSION: v1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fraud_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTEyMzQ1Njc4OTA=}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      ML_SERVICE_BASE_URL: http://ml-service:8000
      ML_SERVICE_INTERNAL_KEY: ${ML_SERVICE_INTERNAL_KEY:-fraud-detection-internal-key-2026}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost
    ports:
      - "8080:8080"
    networks:
      - fraud-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: bridge

volumes:
  postgres-data:
